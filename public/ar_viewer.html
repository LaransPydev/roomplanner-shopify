<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fixed version, so an update of the library can't change how AR opens. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #ar-button {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      z-index: 10;
      padding: 14px 24px;
      background: linear-gradient(135deg, #e4002b, #ff416c);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    #ar-button:disabled {
      opacity: 0.6;
    }

    #message {
      display: none;
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      color: #222;
      font-size: 14px;
      text-align: center;
    }

    /* model-viewer's own progress bar, in Sportstech red */
    model-viewer::part(default-progress-bar) {
      height: 4px;
      background-color: #e4002b;
    }
  </style>
</head>
<body>

<!--
  Android: AR opens inside Chrome with WebXR ("webxr" first), like NordicTrack's configurator.
  It works with any model size, unlike Google's Scene Viewer app, which refuses models over
  15 MB. Scene Viewer is only the fallback. iPhone keeps using Quick Look with the USDZ.
-->
<model-viewer
  id="arViewer"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor"
  ar-scale="fixed"
  camera-controls
  auto-rotate
  environment-image="neutral"
  exposure="1"
  shadow-intensity="1"
  loading="eager"
  reveal="auto">
  <!-- Hide model-viewer's small default AR button; ours is below. -->
  <span slot="ar-button" style="display:none"></span>
</model-viewer>

<div id="message"></div>
<button id="ar-button" disabled>Loading 3D model…</button>

<script>
  const params = new URLSearchParams(window.location.search);
  // Only plain model file names (no paths).
  const raw = params.get("model") || "Sportstech-sBike";
  const modelName = /^[\w\-'. ]+$/.test(raw) ? raw : "Sportstech-sBike";
  const file = encodeURIComponent(modelName);

  // Same site as this page (CloudFront), so the browser may load the model for WebXR.
  const glbUrl = `assets/models/glb/${file}.glb`;
  const usdzUrl = `https://3d-room-planner-s3.s3.eu-north-1.amazonaws.com/assets/models/usdz/${file}.usdz`;

  const viewer = document.getElementById("arViewer");
  const arButton = document.getElementById("ar-button");
  const message = document.getElementById("message");
  const title = modelName.replace(/-roomplanner$/i, "").replace(/[-_]/g, " ");

  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(navigator.userAgent);

  function show(text) {
    message.textContent = text;
    message.style.display = "block";
  }

  viewer.setAttribute("src", glbUrl);
  viewer.setAttribute("ios-src", usdzUrl);
  viewer.setAttribute("alt", title);

  // Big models take a while on a phone: show how far the download is.
  viewer.addEventListener("progress", (e) => {
    const pct = Math.round((e.detail.totalProgress || 0) * 100);
    if (pct < 100) arButton.textContent = `Loading 3D model… ${pct}%`;
  });

  viewer.addEventListener("load", () => {
    arButton.disabled = false;
    arButton.textContent = `${title} – View in your room`;
  });

  viewer.addEventListener("error", () => {
    arButton.textContent = "Model not available";
    show("This 3D model couldn't be loaded.");
  });

  viewer.addEventListener("ar-status", (event) => {
    if (event.detail.status === "failed") {
      show("AR couldn't start on this phone. You can still turn the model in 3D.");
    }
  });

  arButton.addEventListener("click", () => {
    if (isIOS) {
      window.location.href = usdzUrl;
      return;
    }
    if (viewer.canActivateAR) {
      // Opens AR in the browser (WebXR); Chrome asks once to allow the camera / 3D map.
      viewer.activateAR();
    } else if (isAndroid) {
      show("AR needs Chrome and Google Play Services for AR on this phone. You can still turn the model in 3D.");
    } else {
      show("Open this page on your phone to see the model in your room.");
    }
  });
</script>

</body>
</html>
